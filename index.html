<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- browser chrome can't take a color-mix(), so these are the two --bg
         values resolved by hand: violet at 4% into white / 9% into black -->
    <meta name="theme-color" content="#faf7fe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0414" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Leeway - one trusted number that tells UK students what they can safely spend today." />
    <!-- Set the theme before first paint. Without this, a dark-mode user gets a
         full white flash while the JS bundle loads. Mirrors resolveTheme() in
         src/lib/theme.js — keep the two in step. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('leeway:theme')
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Leeway - what can I spend?</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
